name: Build XCFramework

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        default: main
      release_tag:
        description: Existing tag to upload the XCFramework to
        required: false
        default: ""

# Builds are read-only; only the optional publication job can write.
permissions:
  contents: read

jobs:
  build-xcframework:
    name: Build CommitBookEngine.xcframework
    runs-on: macos-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record built commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      # Single source of truth: the script builds every slice, generates the
      # UniFFI bindings, assembles the xcframework, and emits the zip + sha256.
      - name: Build XCFramework
        run: ./crates/commitbook-client/scripts/build-xcframework.sh

      # Compile, link, and run a Swift consumer against the framework. Catches
      # a header/modulemap mismatch or an async method that traps, neither of
      # which fails the build itself, so never publish without this passing.
      - name: Swift smoke test
        run: ./crates/commitbook-client/scripts/smoke-swift.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CommitBookEngine.xcframework
          path: |
            target/CommitBookEngine.xcframework.zip
            target/CommitBookEngine.xcframework.zip.sha256

  publish:
    name: Publish XCFramework
    needs: build-xcframework
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-xcframework.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CommitBookEngine.xcframework
          path: target

      # Only attach to a release when the tag points at the built commit.
      - name: Check the tag matches the built commit
        env:
          TAG: ${{ inputs.release_tag }}
          BUILT_SHA: ${{ needs.build-xcframework.outputs.sha }}
        run: |
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$tagged" != "$BUILT_SHA" ]; then
            echo "Tag ${TAG} is ${tagged}, but the build used ${BUILT_SHA}" >&2
            exit 1
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ needs.build-xcframework.outputs.sha }}
          files: |
            target/CommitBookEngine.xcframework.zip
            target/CommitBookEngine.xcframework.zip.sha256

name: Build XCFramework

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xcframework:
    name: Build CommitBookCore.xcframework
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin --package commitbook-core

      - name: Build x86_64 (Intel)
        run: cargo build --release --target x86_64-apple-darwin --package commitbook-core

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/libcommitbook_core.a \
            target/x86_64-apple-darwin/release/libcommitbook_core.a \
            -output target/universal-apple-darwin/release/libcommitbook_core.a

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/universal-apple-darwin/release/libcommitbook_core.a \
            -headers crates/commitbook-core/src/ffi/ \
            -output CommitBookCore.xcframework

      - name: Package XCFramework
        run: |
          zip -r CommitBookCore.xcframework.zip CommitBookCore.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommitBookCore.xcframework
          path: CommitBookCore.xcframework.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CommitBookCore.xcframework.zip

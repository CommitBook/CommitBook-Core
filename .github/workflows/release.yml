name: Release

on:
  push:
    tags:
      # Bare semver tags, no 'v' prefix: 0.7.0, 0.7.1
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        default: main
      tag_name:
        description: Existing tag to publish
        required: true

# On a tag push the workflow_dispatch inputs are empty, so fall back to the
# pushed ref. RELEASE_REF is what we build from, RELEASE_TAG is what we publish.
env:
  RELEASE_REF: ${{ inputs.ref || github.ref }}
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
  RELEASE_COMMITISH: ${{ inputs.ref || github.sha }}

# Read-only by default; only the job that publishes can write.
permissions:
  contents: read

jobs:
  # Nothing is built for release until the exact commit passes the same
  # checks CI runs, plus the dependency audit.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --deny warnings

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Pinned: this job builds the shipped binaries, so it must not run
      # whatever lands on cross's default branch. To update, pick a newer
      # commit of https://github.com/cross-rs/cross and change the rev.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4 --locked

      # Only the desktop binaries, from the committed lockfile. OpenSSL and
      # libgit2 are bundled on purpose (vendored-tls) so the Linux binaries
      # do not depend on the user's system OpenSSL version.
      - name: Build
        shell: bash
        run: |
          args=(--release --locked --target "${{ matrix.target }}"
                -p commitbook-cli -p commitbook-tui -p commitbook-web
                --features commitbook-engine/vendored-tls)
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build "${args[@]}"
          else
            cargo build "${args[@]}"
          fi

      # All three binaries are built above, so a missing one fails the release
      # instead of silently shipping a CLI-only archive.
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../commitbook-${{ matrix.target }}.tar.gz commitbook commitbook-tui commitbook-web

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commitbook-${{ matrix.target }}
          path: commitbook-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Add required reviewers to this environment in the repository settings
    # (Settings > Environments > release) so publishing needs an approval.
    environment: release
    steps:
      # Checked out into a subdirectory so install.sh can be published as a
      # release asset without the repo tree colliding with the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          path: repo

      # A dispatch names a ref to build and a tag to publish to. Refuse to
      # attach binaries built from anything but the commit that tag points at,
      # so an existing release cannot be overwritten with other code.
      - name: Check the tag matches the built commit
        working-directory: repo
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          built="$(git rev-parse HEAD)"
          if [ "$tagged" != "$built" ]; then
            echo "Tag ${TAG} is ${tagged}, but the build used ${built}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum commitbook-*.tar.gz > SHA256SUMS
          cp repo/install.sh install.sh
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_COMMITISH }}
          generate_release_notes: true
          files: |
            commitbook-*.tar.gz
            SHA256SUMS
            install.sh

[package]
name = "commitbook-engine"
description = "Shared engine for CommitBook, config, git, AI, scheduling, logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Bundle libgit2 and OpenSSL, statically linked. The mobile SDK always uses
# it. Desktop release binaries use it too (see .github/workflows/S2-Release-GitHub.yml),
# so they run on any glibc Linux without a matching system OpenSSL; the cost
# is that an OpenSSL security fix needs a new CommitBook release. Local
# `cargo build` of the desktop crates alone links the system libraries.
vendored-tls = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh"] }
hex = "0.4.3"
getrandom = "0.4.3"
libc = "0.2.189"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tempfile = "3.27.0"
toml_edit = "0.25.15"
url = "2.5.8"

# Desktop-only deps. iOS/Android builds skip these; their consumers
# (cron/*, ai/{claude,copilot,codex,gemini,cursor}.rs, git/signing.rs) are
# cfg-gated off mobile.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
dirs = "7.0.0"
which = "8.0.6"

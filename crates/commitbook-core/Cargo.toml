[package]
name = "commitbook-core"
description = "Core library for CommitBook — config, git, AI, scheduling, logging"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "5.0"
env_logger = "0.11"
fs2 = "0.4"
git2 = "0.19"
hex = "0.4"
log = "0.4"
nanoid = "0.4"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
which = "7"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[package]
name = "commitbook-tui"
description = "Terminal dashboard for CommitBook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "commitbook-tui"
path = "src/main.rs"

[dependencies]
commitbook-engine = { path = "../commitbook-engine" }
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

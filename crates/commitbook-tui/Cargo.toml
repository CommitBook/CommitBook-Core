[package]
name = "commitbook-tui"
description = "Terminal dashboard for CommitBook"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "commitbook-tui"
path = "src/main.rs"

[dependencies]
commitbook-engine = { path = "../commitbook-engine" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
which = "7"

[dev-dependencies]
tempfile = "3"

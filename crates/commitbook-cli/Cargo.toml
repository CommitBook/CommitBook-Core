[package]
name = "commitbook-cli"
description = "CLI for CommitBook — automated git commits for markdown notebooks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "commitbook"
path = "src/main.rs"

[dependencies]
commitbook-core = { path = "../commitbook-core" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
env_logger = "0.11"
fs2 = "0.4"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

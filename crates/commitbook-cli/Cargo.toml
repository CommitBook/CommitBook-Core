[package]
name = "commitbook-cli"
description = "CLI for CommitBook, automated git commits for markdown notebooks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "commitbook"
path = "src/main.rs"

[dependencies]
commitbook-engine = { path = "../commitbook-engine" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.2"
colored = "3.1.1"
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

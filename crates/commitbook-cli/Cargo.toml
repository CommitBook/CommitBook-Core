[package]
name = "commitbook-cli"
default-run = "commitbook"
description = "CLI for CommitBook, automated git commits for markdown notebooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "commitbook"
path = "src/main.rs"

[[bin]]
name = "cobo"
path = "src/bin/cobo.rs"

[dependencies]
commitbook-engine = { path = "../commitbook-engine" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
colored = "3.1.1"
dirs = "7.0.0"
env_logger = "0.11.11"
log = "0.4.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3.27.0"

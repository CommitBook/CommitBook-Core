[package]
name = "commitbook-client"
description = "Platform-agnostic UniFFI SDK exposing CommitBookEngineClient on top of commitbook-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "commitbook_client"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
commitbook-engine = { path = "../commitbook-engine", features = ["vendored-tls"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
git2 = "0.19"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.31", features = ["tokio", "cli"] }

[dev-dependencies]
# pollster drives a future to completion on a plain thread with no ambient
# tokio runtime, reproducing how UniFFI's UDL scaffolding polls [Async]
# methods. Used by client_tests.rs to guard the shared-runtime wiring.
pollster = "0.4"
tempfile = "3"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

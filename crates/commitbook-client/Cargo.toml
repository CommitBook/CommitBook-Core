[package]
name = "commitbook-client"
description = "Platform-agnostic UniFFI SDK exposing CommitBookEngineClient on top of commitbook-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "commitbook_client"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
commitbook-engine = { path = "../commitbook-engine", features = ["vendored-tls"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
# Static SDK artifacts must not inherit a host pkg-config libgit2; otherwise
# the native symbols are absent from the XCFramework/AAR archive.
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2"] }
hex = "0.4.3"
libc = "0.2.189"
sha2 = "0.11.0"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }

[dev-dependencies]
# pollster drives a future to completion on a plain thread with no ambient
# tokio runtime, reproducing how UniFFI's UDL scaffolding polls [Async]
# methods. Used by client_tests.rs to guard the shared-runtime wiring.
pollster = "1.0.1"
tempfile = "3.27.0"

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

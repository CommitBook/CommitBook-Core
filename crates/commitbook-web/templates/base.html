<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommitBook — {% block title %}Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
      integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
      crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --orange: #db6d28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        nav .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        nav a:hover, nav a.active {
            color: var(--text);
            background: var(--border);
        }
        .container {
            max-width: 960px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .kv { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
        .kv:last-child { border-bottom: none; }
        .kv .label { color: var(--text-muted); }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
        .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
        .badge-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
        .badge-gray { background: rgba(139,148,158,0.15); color: var(--text-muted); }
        .provider-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-green { background: var(--green); }
        .dot-red { background: var(--red); }
        button, .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button:hover, .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--red); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
        td { padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        .level-ERROR { color: var(--red); }
        .level-WARN { color: var(--yellow); }
        .level-INFO { color: var(--green); }
        .level-DEBUG { color: var(--text-muted); }
        input, select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .form-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .form-row label { min-width: 100px; color: var(--text-muted); }
        .form-row input, .form-row select { flex: 1; }
        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .flash {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .flash-success { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
        .flash-error { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
        .ts { color: var(--text-muted); font-size: 0.8rem; }
        .pagination { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }
        .pagination .info { color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">CommitBook</a>
        <a href="/">Dashboard</a>
        <a href="/logs">Logs</a>
        <a href="/config">Config</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

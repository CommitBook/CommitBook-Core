[workspace]
members = [
    "crates/commitbook-engine",
    "crates/commitbook-cli",
    "crates/commitbook-tui",
    "crates/commitbook-web",
    "crates/commitbook-ffi",
]
resolver = "2"

[workspace.package]
rust-version = "1.91"
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Manuel Gruber"]

[profile.release]
strip = true
lto = true
opt-level = "z"

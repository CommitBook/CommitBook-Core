[workspace]
members = [
    "crates/commitbook-engine",
    "crates/commitbook-cli",
    "crates/commitbook-tui",
    "crates/commitbook-web",
    "crates/commitbook-client",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["ZAAI"]

[profile.release]
strip = true
lto = true
opt-level = "z"
